<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" fill="none" aria-hidden="true">
  <style>
    .shield { animation: float 3.8s ease-in-out infinite; }
    .lock { animation: pulse 2.2s ease-in-out infinite; }
    .node { animation: blink 2.2s ease-in-out infinite; }
    .node-b { animation: blink 2.2s ease-in-out 0.45s infinite; }
    .scan { animation: scan 2.8s ease-in-out infinite; }
    .alert { animation: blink 1.5s ease-in-out infinite; }
    .perimeter { stroke-dasharray: 7 4; animation: dash 5.5s linear infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes scan {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(34px); opacity: 0.95; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -110; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shield, .lock, .node, .node-b, .scan, .alert, .perimeter { animation: none !important; }
    }
  </style>
