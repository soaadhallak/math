<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" fill="none" aria-hidden="true">
  <style>
    .float-a { animation: float-a 4s ease-in-out infinite; }
    .float-b { animation: float-b 4.8s ease-in-out infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .bars rect { transform-box: fill-box; transform-origin: bottom center; }
    .bar-1 { animation: bar 2.4s ease-in-out infinite; }
    .bar-2 { animation: bar 2.4s ease-in-out 0.15s infinite; }
    .bar-3 { animation: bar 2.4s ease-in-out 0.3s infinite; }
    .bar-4 { animation: bar 2.4s ease-in-out 0.45s infinite; }
    .draw { stroke-dasharray: 10 8; animation: dash 4.5s linear infinite; }
    .chrome { animation: chrome 3.2s ease-in-out infinite; }
    @keyframes float-a {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(2px, -8px); }
    }
    @keyframes float-b {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-3px, 6px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes bar {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.68); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes chrome {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .float-a, .float-b, .pulse, .bar-1, .bar-2, .bar-3, .bar-4, .draw, .chrome {
        animation: none !important;
      }
    }
  </style>
