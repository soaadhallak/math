<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" fill="none" aria-hidden="true">
  <style>
    .node { animation: node-pulse 2.6s ease-in-out infinite; }
    .node-b { animation: node-pulse 2.6s ease-in-out 0.35s infinite; }
    .node-c { animation: node-pulse 2.6s ease-in-out 0.7s infinite; }
    .flow { stroke-dasharray: 5 5; animation: dash 3.8s linear infinite; }
    .flow-b { stroke-dasharray: 4 6; animation: dash 5s linear infinite reverse; }
    .scan { animation: scan 3.2s ease-in-out infinite; }
    .float { animation: float 3.8s ease-in-out infinite; }
    .core { animation: core 2.8s ease-in-out infinite; }
    @keyframes node-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.92); transform-origin: center; transform-box: fill-box; }
      50% { opacity: 1; transform: scale(1.12); transform-origin: center; transform-box: fill-box; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes scan {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(18px); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes core {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .node-b, .node-c, .flow, .flow-b, .scan, .float, .core { animation: none !important; }
    }
  </style>
