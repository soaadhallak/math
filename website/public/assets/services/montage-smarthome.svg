<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" fill="none" aria-hidden="true">
  <style>
    .node { animation: blink 2.4s ease-in-out infinite; }
    .node-b { animation: blink 2.4s ease-in-out 0.4s infinite; }
    .wave { animation: wave 3.2s ease-in-out infinite; }
    .wave-b { animation: wave 3.8s ease-in-out 0.25s infinite; }
    .float { animation: float 4s ease-in-out infinite; }
    .dial { transform-origin: 480px 100px; animation: dial 4.5s ease-in-out infinite; }
    .knob { animation: slide 3.6s ease-in-out infinite; }
    .preset { animation: preset 3s ease-in-out infinite; }
    @keyframes blink {
      0%, 100% { opacity: 0.35; transform: scale(0.9); transform-box: fill-box; transform-origin: center; }
      50% { opacity: 1; transform: scale(1.2); transform-box: fill-box; transform-origin: center; }
    }
    @keyframes wave {
      0%, 100% { opacity: 0.2; transform: translateY(0) scaleX(1); transform-origin: center; }
      50% { opacity: 0.75; transform: translateY(-4px) scaleX(1.04); transform-origin: center; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes dial {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes slide {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(28px); }
    }
    @keyframes preset {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .node-b, .wave, .wave-b, .float, .dial, .knob, .preset { animation: none !important; }
    }
  </style>
