<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" fill="none" aria-hidden="true">
  <style>
    .cloud { animation: float 4s ease-in-out infinite; }
    .led { animation: blink 1.6s ease-in-out infinite; }
    .led-b { animation: blink 1.6s ease-in-out 0.25s infinite; }
    .led-c { animation: blink 1.6s ease-in-out 0.5s infinite; }
    .ring { transform-origin: 380px 260px; animation: spin 7s linear infinite; }
    .chart { stroke-dasharray: 7 6; animation: dash 4.2s linear infinite; }
    .pipe { animation: pulse 2.2s ease-in-out infinite; }
    .rack { animation: rack 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes rack {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.95; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud, .led, .led-b, .led-c, .ring, .chart, .pipe, .rack { animation: none !important; }
    }
  </style>
